joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e);});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e);});
const je=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;kn.style.transform='';}};joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
const hold=(id,fn)=>{const b=$(id);b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);fn(1);});['pointerup','pointercancel'].forEach(t=>b.addEventListener(t,()=>fn(0)));};
hold('gas',v=>{gasB=v;});hold('rev',v=>{revB=v;});hold('brk',v=>{if(v&&P.v>8)noise(.25,3500);brkB=v;});
addEventListener('keydown',e=>{key[e.key.toLowerCase()]=1;if(e.key==='e')doAct();});addEventListener('keyup',e=>{key[e.key.toLowerCase()]=0;});
$('act').onclick=()=>doAct();$('home').onclick=()=>{save();location.href='index.html';};
function doAct(){if(dlgOpen||!act)return;act.f();}
const dl=$('dlg');
function dlg(t,x,bs){dlgOpen=true;dl.style.display='block';dl.innerHTML='<b>'+t+'</b><p>'+x+'</p><div></div>';const dv=dl.lastChild;(bs||[['Tutup']]).forEach(b=>{const e=document.createElement('button');e.className='b';e.textContent=b[0];e.onclick=()=>{dl.style.display='none';dlgOpen=false;if(b[1])b[1]();save();};dv.appendChild(e);});}
function goFS(){const e=document.documentElement,rq=e.requestFullscreen||e.webkitRequestFullscreen;const lk=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(x){}};try{const p=rq&&rq.call(e);if(p&&p.then)p.then(lk).catch(()=>{});else lk();}catch(x){}}
addEventListener('pointerdown',()=>{if(entered&&!document.fullscreenElement&&!document.webkitFullscreenElement)goFS();});

/* ---- aksi ---- */
function mount(i){const b=bikes[i];P.m=i;S.bike=i;P.x=b.x;P.z=b.z;P.h=b.h;P.v=0;P.s=0;P.rpm=1500;P.pitch=0;b.body.add(av);av.position.set(0,.4,-.45);av.rotation.set(.3,0,0);av.legL.rotation.x=av.legR.rotation.x=-1.3;av.armL.rotation.x=av.armR.rotation.x=-1.1;noise(.2,900);toast('🏍️ '+BK[i].n+' · mesin menyala');}
function dismount(){const b=bikes[P.m];b.x=P.x;b.z=P.z;b.h=P.h;sc.add(av);av.rotation.set(0,P.h,0);av.head.rotation.y=0;P.look=0;P.x=b.x-Math.cos(P.h)*1.1;P.z=b.z+Math.sin(P.h)*1.1;av.legL.rotation.x=av.legR.rotation.x=av.armL.rotation.x=av.armR.rotation.x=0;P.m=-1;P.v=0;b.fork.rotation.y=0;b.body.rotation.x=0;b.body.position.set(0,0,0);hy=0;hv=0;b.g.position.y=0;b.g.rotation.z=0;}
function startRace(){raceSt=1;cnt=3.4;P.x=-2;P.z=46;P.h=0;P.v=0;P.s=0;npc.g.visible=true;npc.x=2;npc.z=46;npcV=0;npcT=0;plDone=0;npc.g.position.set(2,0,46);npc.g.rotation.y=0;toast('Tahan gas! Geber dulu 😎');}
function endRace(win,t){raceSt=3;const rw=win?200:40;S.coins+=rw;if(!S.best||t<S.best)S.best=t;save();big((win?'🏆 MENANG! ':'😅 KALAH ')+t.toFixed(2)+'s\n+'+rw+' 💰',4500);setTimeout(()=>{raceSt=0;npc.g.visible=false;},4500);}
function buyHouse(i){if(S.coins<400)return toast('Koin kurang (400 💰)');S.coins-=400;S.house[i]=1;const h=HOUSES[i];h.door.visible=false;A.splice(A.indexOf(h.db),1);toast('🏠 Rumah '+(i+1)+' jadi milikmu! Masuk dan tidur di kasur');save();}
function sleep(){$('fade').style.opacity=1;setTimeout(()=>{dayT=Math.PI/2;$('fade').style.opacity=0;toast('😴 Selamat pagi! Progres tersimpan');save();},1500);}
function shop(){const i=S.bike,c=BK[i],mk=(k,n,pr)=>{const lv=S[k][i];if(lv>=pr.length)return null;const p=pr[lv];return [n+' Lv'+(lv+1)+' ('+p+' 💰)',()=>{if(S.coins<p)return toast('Koin kurang');S.coins-=p;S[k][i]++;save();shop();}];};
 const bs=[];BK.forEach((b,j)=>{if(!S.own[j])bs.push(['Beli '+b.n+' ('+b.price+' 💰)',()=>{if(S.coins<b.price)return toast('Koin kurang');S.coins-=b.price;S.own[j]=1;S.bike=j;save();shop();}]);});
 dlg('🛒 Toko Suku Cadang · Pak Joko','Koin: 💰 '+S.coins+'<br>Motor aktif: <b>'+c.n+'</b> · Mesin Lv'+S.eng[i]+' · Knalpot Lv'+S.exh[i]+' · Jengat Lv'+(S.wl[i]||0)+'/5<br>Upgrade berlaku untuk motor yang terakhir kamu naiki.',[...[mk('eng','🔧 Mesin',[300,700,1500]),mk('exh','🔊 Knalpot',[250,600,1300]),mk('wl','🤸 Kopling Spontan (jengat & jemping)',[200,450,900,1600,2800])].filter(Boolean),...bs,['Tutup']]);}
function settings(){dlg('⚙️ Pengaturan','Rekor drag 200 m: <b>'+(S.best?S.best.toFixed(2)+' dtk':'-')+'</b><br>Grafik: Sedang = ringan, Tinggi = bayangan, Ultra = bayangan tajam + kota padat (anti-alias aktif setelah buka ulang).',[
 ['Grafik: '+QN[S.gfx],()=>{S.gfx=(S.gfx+1)%3;applyG();settings();}],['Suara: '+(S.snd?'ON':'OFF'),()=>{S.snd=S.snd?0:1;settings();}],['Tutup']]);}
$('bSet').onclick=()=>{if(!dlgOpen)settings();};
function findAct(){if(raceSt===1||raceSt===2)return null;
 if(P.m>=0){if(P.z>34&&P.z<60&&Math.abs(P.x)<5&&P.v<4)return{l:'🏁 Balap vs Rizal',f:startRace};return P.v<2?{l:'⬇️ Turun',f:dismount}:null;}
 let r=null,bd=99;const c=(d,o)=>{if(d<bd){bd=d;r=o;}};
 bikes.forEach(b=>{const d=Math.hypot(b.x-P.x,b.z-P.z);if(d<2.6)c(d,{l:S.own[b.i]?'🏍️ Naik':'🔒 '+BK[b.i].n,f:()=>S.own[b.i]?mount(b.i):toast('Beli di toko: '+BK[b.i].price+' 💰')});});
 const ds=Math.hypot(16-P.x,14-P.z);if(ds<3.8)c(ds,{l:'🛒 Toko Suku Cadang',f:shop});
 HOUSES.forEach(h=>{const dd=Math.hypot(h.fx+h.ds*1.4-P.x,h.hz-P.z);if(!S.house[h.i]&&dd<3.6)c(dd,{l:'🏠 Beli rumah '+(h.i+1)+' (400 💰)',f:()=>buyHouse(h.i)});const db=Math.hypot(h.bed[0]-P.x,h.bed[1]-P.z);if(S.house[h.i]&&db<2.6)c(db-.5,{l:'😴 Tidur',f:sleep});});
 return r;}

/* ---- fisika ---- */
function push(b,r){const x=P.x,z=P.z;if(x>b[0]&&x<b[1]&&z>b[2]&&z<b[3]){const d=[x-b[0],b[1]-x,z-b[2],b[3]-z],m=Math.min(...d);if(m===d[0])P.x=b[0]-r;else if(m===d[1])P.x=b[1]+r;else if(m===d[2])P.z=b[2]-r;else P.z=b[3]+r;return 1;}
 const cx=clamp(x,b[0],b[1]),cz=clamp(z,b[2],b[3]),dx=x-cx,dz=z-cz,dd=Math.hypot(dx,dz);if(dd<r&&dd>1e-6){P.x=cx+dx/dd*r;P.z=cz+dz/dd*r;return 1;}return 0;}
function collide(){const r=P.m>=0?.8:.4;let hit=0;for(const b of A)hit|=push(b,r);if(P.m>=0)for(const b of HB)hit|=push(b,r);if(P.z>34)for(let k=0;k<city.count;k++)hit|=push(CITY[k],r);P.x=clamp(P.x,-390,390);P.z=clamp(P.z,-29,330);return hit;}
function step(dt){
 const jX=clamp(jx+(key.d||key.arrowright?1:0)-(key.a||key.arrowleft?1:0),-1,1),jY=clamp(jy+(key.s||key.arrowdown?1:0)-(key.w||key.arrowup?1:0),-1,1);
 if(P.m<0){P.h-=jX*2.4*dt;const sp=-jY*4.6;P.v=sp;P.x+=Math.sin(P.h)*sp*dt;P.z+=Math.cos(P.h)*sp*dt;collide();av.position.set(P.x,0,P.z);av.rotation.y=P.h;const w=Math.sin(T*9)*.8*Math.min(1,Math.abs(sp)/4);av.legL.rotation.x=w;av.legR.rotation.x=-w;av.armL.rotation.x=-w*.7;av.armR.rotation.x=w*.7;}
 else{const b=bikes[P.m],rev=(revB||key.r)?1:0,gas=(gasB||key.w||key.arrowup)?1:0,brk=(brkB||key.s||key.arrowdown)?1:0,vm=vmax(),locked=raceSt===1;
  const wl=S.wl[P.m]||0;P.thr+=(gas-P.thr)*Math.min(1,dt*(7+wl*6));
  if(!locked&&P.thr>.02)P.v+=(pwr()*(1+.1*wl)+wl*3*Math.max(0,1-Math.max(0,P.v)/12))*P.thr*Math.max(0,1-Math.pow(Math.max(0,P.v)/vm,1.6))*dt;
  if(brk)P.v=P.v>0?Math.max(0,P.v-24*dt):Math.min(0,P.v+24*dt);
  if(rev&&!locked&&!gas&&!brk&&P.v<=.4)P.v+=(-3.4-P.v)*Math.min(1,dt*2.5);
  else if(P.v>0)P.v-=(P.thr<.05?1.4+P.v*.035:.25+P.v*.004)*dt;else if(P.v<0)P.v=Math.min(0,P.v+8*dt);
  if(locked)P.v=0;P.v=clamp(P.v,-3.5,vm*1.02);if(!isFinite(P.v))P.v=0;
  const lk=(rev&&!locked&&!gas)?1:0;P.look+=(lk-P.look)*Math.min(1,dt*6);
  if(P.v<-.2){beepT-=dt;if(beepT<=0){beepT=.7;noise(.12,2800);}}
  P.s+=(jX-P.s)*Math.min(1,dt*8);P.h-=P.s*(.5/(1+P.v*.12))*P.v/1.6*dt;
  P.x+=Math.sin(P.h)*P.v*dt;P.z+=Math.cos(P.h)*P.v*dt;if(collide()&&Math.abs(P.v)>2){P.v*=.55;noise(.3,500);}
  const vp=Math.max(0,P.v),g=Math.min(4,Math.floor(vp/vm*5)),fr=clamp((vp-g*vm/5)/(vm/5),0,1);let tg;
  if(P.thr>.05)tg=P.v<1.2?1500+P.thr*6700:2600+fr*5200*(.6+.4*P.thr);else tg=P.v<-.2?2300:1500+(vp/vm)*3200+(vp>.5?500:0);
  P.rpm+=(tg-P.rpm)*Math.min(1,dt*(tg>P.rpm?6+wl*2:2.5));if(g>P.pg&&P.thr>.3)P.rpm-=1400;P.pg=g;P.rpm=clamp(P.rpm,1400,8300);if(!isFinite(P.rpm))P.rpm=1500;if(!isFinite(P.pitch))P.pitch=0;if(!isFinite(P.x)||!isFinite(P.z)){P.x=b.x;P.z=b.z;}
  if(P.pthr>.7&&P.thr<.25&&P.rpm>5000)noise(.35,1200);P.pthr=P.thr;
  const wmax=Math.min(1.3,BK[P.m].w*(1+S.eng[P.m]*.15)+wl*.26),ww=14+wl*4,wt=wmax*((P.thr>.9&&P.v<ww&&!locked)?1:0)*Math.max(0,1-Math.max(0,P.v)/ww);P.pitch+=(wt-P.pitch)*Math.min(1,dt*(5+wl*2));
  if(wl>=3&&hy===0&&((pLock&&!locked&&gas)||(gas&&!pGas&&P.v<4&&!locked)))hv=3+wl*.6;pLock=locked;pGas=gas;
  if(hv!==0||hy>0){hv-=22*dt;hy+=hv*dt;if(hy<=0){if(hv<-3)noise(.25,220);hy=0;hv=0;}}
  b.x=P.x;b.z=P.z;b.h=P.h;b.g.position.set(P.x,hy,P.z);b.g.rotation.y=P.h;b.g.rotation.z=P.s*Math.min(1,Math.abs(P.v)/15)*.45;b.body.rotation.x=-P.pitch;b.body.position.y=.85*Math.sin(P.pitch)+.33*(1-Math.cos(P.pitch));b.body.position.z=.85*(1-Math.cos(P.pitch))+.33*Math.sin(P.pitch);
  b.fork.rotation.y=-P.s*.55;const pd=P.look*Math.sin(T*8)*Math.min(1,Math.abs(P.v)/1.5)*.35;av.head.rotation.y=P.look*2.2;av.rotation.y=P.look*.5;av.rotation.x=.3-P.look*.3-P.pitch*.5;av.legL.rotation.x=-1.3+P.look*.75+pd;av.legR.rotation.x=-1.3+P.look*.75-pd;b.fs.rotation.x+=P.v*dt/.38;b.rs.rotation.x+=P.v*dt/.38;
  if(raceSt===2){raceT+=dt;npcV+=8.6*Math.max(0,1-Math.pow(npcV/38,1.6))*dt;npc.z+=npcV*dt;npc.g.position.z=npc.z;npc.fs.rotation.x+=npcV*dt/.38;npc.rs.rotation.x+=npcV*dt/.38;if(!npcT&&npc.z>=250)npcT=raceT;if(!plDone&&P.z>=250){plDone=raceT;endRace(!npcT,plDone);}}
 }
 if(raceSt===1){cnt-=dt;if(cnt>0)big(String(Math.ceil(cnt)));else{raceSt=2;raceT=0;big('GO!',900);}}
 T+=dt;dayT+=dt*.02;
}
function audioStep(){if(!AC)return;const on=S.snd&&P.m>=0,f=P.rpm/60*(1+.12*S.exh[Math.max(0,P.m)]);const t=AC.currentTime;
 o1.frequency.setTargetAtTime(f,t,.03);o2.frequency.setTargetAtTime(f/2,t,.03);lp.frequency.setTargetAtTime(500+P.rpm*.28+P.thr*700,t,.05);gn.gain.setTargetAtTime(on?.05+.1*P.thr+.05*(P.rpm/8300):0,t,.05);}

/* ---- loop ---- */
let acc=0,last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!dlgOpen)step(dt);else T+=dt;
 const dn=.2+.8*((Math.sin(dayT)+1)/2);sc.background.setRGB(.1+.5*dn,.14+.6*dn,.28+.55*dn);sc.fog.color.copy(sc.background);HL.intensity=.3+.6*dn;sun.intensity=.1+.6*dn;
 sun.target.position.set(P.x,0,P.z);sun.position.set(P.x+40,80,P.z+30);
 HOUSES.forEach(h=>{h.roof.visible=!(Math.abs(P.x-h.hx)<3.4&&Math.abs(P.z-h.hz)<3.4);});
 const d=P.m>=0?6.2+P.v*.05:4.6,hg=P.m>=0?2.5:2.3;cam.position.lerp(new THREE.Vector3(P.x-Math.sin(P.h)*d,hg,P.z-Math.cos(P.h)*d),Math.min(1,dt*6));cam.lookAt(P.x+Math.sin(P.h)*2,1.2,P.z+Math.cos(P.h)*2);
 const fv=62+P.v*.3;if(Math.abs(cam.fov-fv)>.3){cam.fov=fv;cam.updateProjectionMatrix();}
 audioStep();acc+=dt;if(acc>.12){acc=0;act=dlgOpen?null:findAct();const a=$('act');a.style.display=act?'block':'none';if(act)a.textContent=act.l;
  $('coins').textContent='💰 '+S.coins;const m=P.m>=0;$('pad').style.display=m?'flex':'none';$('spd').style.display=m?'block':'none';$('kmh').textContent=(P.v<-.1?'R ':'')+Math.abs(Math.round(P.v*3.6));$('rb').firstChild.style.width=clamp((P.rpm-1400)/6900*100,0,100)+'%';}
 R.render(sc,cam);}
setInterval(()=>{if(entered&&raceSt===0){S.x=P.x;S.z=P.z;S.h=P.h;S.bp=bikes.map(b=>[b.x,b.z,b.h]);save();}},5000);
addEventListener('pagehide',()=>{S.x=P.x;S.z=P.z;S.h=P.h;S.bp=bikes.map(b=>[b.x,b.z,b.h]);save();});

(async()=>{applyG();
 for(let i=0;i<STG.length;i++){$('lt').textContent=STG[i][0]+'…';await new Promise(r=>setTimeout(r,40));try{STG[i][1]();}catch(e){console.error(e);}const p=(i+1)/STG.length;$('lb').firstChild.style.width=p*100+'%';$('gc').style.strokeDashoffset=251*(1-p);}
applyG();if(P.m<0&&av){av.position.set(P.x,0,P.z);av.rotation.y=P.h;}
 $('lt').textContent='Siap!';$('lgo').style.display='block';
 $('load').addEventListener('pointerdown',()=>{if(entered)return;entered=true;initAudio();goFS();$('load').remove();toast('Halo '+USER+'! Dekati motor lalu ketuk 🏍️ Naik');requestAnimationFrame(t=>{last=t;loop(t);});},{once:true});
})();
