 const mk=(a,len)=>{const b=AC.createBuffer(1,len,SUP_SR);b.copyToChannel(f.subarray(a,a+len),0);return b;};

  if(fT<=SUPB[ix[0]].f){g[ix[0]]=gk;return;}if(fT>=SUPB[ix[ix.length-1]].f){g[ix[ix.length-1]]=gk;return;}
  for(let j=0;j<ix.length-1;j++){const a=SUPB[ix[j]].f,b=SUPB[ix[j+1]].f;if(fT>=a&&fT<=b){let w=cl((Math.log(fT/a)/Math.log(b/a)-.2)/.6,0,1);w=w*w*(3-2*w);g[ix[j]]=gk*Math.cos(w*Math.PI/2);g[ix[j+1]]=gk*Math.sin(w*Math.PI/2);break;}}});
