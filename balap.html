 else if(s<2*L+pi*R){x=cx+L/2-(s-L-pi*R);z=cz+R;nx=0;nz=1;h=-pi/2;}
 else{f=pi/2+(s-2*L-pi*R)/R;x=cx-L/2+R*Math.cos(f);z=cz+R*Math.sin(f);nx=Math.cos(f);nz=Math.sin(f);h=Math.atan2(-Math.sin(f),Math.cos(f));}
 return{x:x+nx*o,z:z+nz*o,h};}
function prj(c,x,z){const{cx,cz,L,R}=c,u=x-cx,pi=Math.PI;let s,lat;
 if(Math.abs(u)<=L/2){const dz=z-cz;lat=Math.abs(dz)-R;s=dz<0?u+L/2:L+pi*R+(L/2-u);}
 else if(u>0){const dx=x-(cx+L/2),dz=z-cz;lat=Math.hypot(dx,dz)-R;s=L+R*(Math.atan2(dz,dx)+pi/2);}
 else{const dx=x-(cx-L/2),dz=z-cz;let f=Math.atan2(dz,dx);if(f<0)f+=2*pi;lat=Math.hypot(dx,dz)-R;s=2*L+pi*R+R*(f-pi/2);}
 return{s,lat};}

function crStep(dt){const c=CIR[cr.c],T=c.Lt;cr.t+=dt;const q=prj(c,P.x,P.z),on=Math.abs(q.lat)<=c.W/2+.6;

function npcStep(dt){const hid=raceSt>0||cr.st>0;
 PED.forEach(n=>{const g=n.g;if(n.cd>0)n.cd-=dt;if(n.hide)return;if(n.ic){n.ic.visible=true;n.ic.position.set(n.x,2.3,n.z);}

  const dx=n.tx-n.x,dz=n.tz-n.z,d=Math.hypot(dx,dz);if(d<.4){n.w=rnd(1.5,5);n.wave=Math.random()<.4?2.2:0;return;}
  const m=Math.min(d,n.sp*dt);n.x+=dx/d*m;n.z+=dz/d*m;let a=Math.atan2(dx,dz)-g.rotation.y;a=Math.atan2(Math.sin(a),Math.cos(a));g.rotation.y+=a*Math.min(1,dt*8);
  const w=Math.sin(T*n.sp*5)*.7;g.legL.rotation.x=w;g.legR.rotation.x=-w;g.armL.rotation.x=-w*.6;g.armR.rotation.x=w*.6;g.position.set(n.x,Math.abs(w)*.05,n.z);});
 RID.forEach(q=>{const b=q.b,r=q.r;b.g.visible=!hid;if(hid)return;q.t+=q.dir*q.sp*dt;if(q.t>r.b||q.t<r.a)q.dir*=-1;const l=q.dir>0?-2.2:2.2;
  if(r.ax==='x'){b.g.position.set(q.t,0,r.c+l);b.g.rotation.y=q.dir>0?Math.PI/2:-Math.PI/2;}else{b.g.position.set(r.c-l,0,q.t);b.g.rotation.y=q.dir>0?0:Math.PI;}
  b.fs.rotation.x+=q.sp*dt/.38;b.rs.rotation.x+=q.sp*dt/.38;});}
