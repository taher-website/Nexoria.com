<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXORIA</title>
<meta name="theme-color" content="#050308">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050308;--void:#02010a;--card:#0f0c1e;--cardhi:#151230;--line:#8b7bff2b;--line2:#ffffff14;
  --ink:#f3f1ff;--mute:#9a93c2;--mute2:#6d6796;
  --cy:#39f4ff;--mg:#ff2fa6;--vi:#8b5cf6;--gold:#ffcf6b;--ok:#33f2a0;--bad:#ff4d6a;
  --font-d:'Orbitron',sans-serif;--font-b:'Sora',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050308}}
:root[data-theme="dark"]{--bg:#050308}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{position:relative;overflow-x:hidden;background:var(--bg)}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#stars{position:fixed;inset:0;z-index:-1;background:var(--bg)}

/* ---------- Blackhole visual ---------- */
.bh{position:absolute;pointer-events:none}
.bh::before{content:'';position:absolute;inset:-45%;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,var(--cy) 35deg,transparent 90deg,var(--mg) 170deg,transparent 230deg,var(--vi) 300deg,transparent 360deg);
  filter:blur(22px);opacity:.8;animation:spin 22s linear infinite}
.bh::after{content:'';position:absolute;inset:16%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#1c1236 0%,#050308 55%,#000 100%);
  box-shadow:0 0 70px 14px #000,inset 0 0 46px #000}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bh::before{animation:none}}

/* ---------- Layar username ---------- */
#splash{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:var(--void)}
#splash .bh{width:420px;height:420px;top:-140px;right:-140px}
.sp-card{position:relative;z-index:1;width:min(92vw,420px);text-align:center;padding:34px 24px 26px;border-radius:24px;
  background:linear-gradient(180deg,var(--cardhi),var(--card));border:1px solid var(--line);box-shadow:0 30px 90px #000c,0 0 0 1px #ffffff08 inset}
.logo{font-family:var(--font-d);font-weight:900;font-size:clamp(32px,10vw,46px);letter-spacing:.12em;margin:0;line-height:1;
  background:linear-gradient(90deg,var(--cy),var(--vi) 55%,var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-sub{margin:12px 0 26px;color:var(--mute);font-size:14px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:8px;text-align:left}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mute)}
.field input{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--void);color:var(--ink);padding:0 16px;font:inherit;font-size:17px;font-weight:600;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--cy);box-shadow:0 0 0 4px #39f4ff22}
.hint{font-size:12px;color:var(--mute2);margin:2px 0 0}
.err{min-height:18px;margin:10px 0 0;font-size:13px;font-weight:700;color:var(--bad)}
.btn{width:100%;height:52px;margin-top:8px;border:0;border-radius:14px;font-size:16px;font-weight:800;letter-spacing:.02em;color:#04101c;
  background:linear-gradient(90deg,var(--cy),var(--vi));cursor:pointer;box-shadow:0 10px 28px #39f4ff33;transition:transform .12s,box-shadow .12s}
.btn:hover{box-shadow:0 12px 34px #39f4ff4d}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.5;cursor:wait;box-shadow:none}
.btn.ghost{background:#ffffff10;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.small{width:auto;padding:0 18px;height:44px;font-size:14px}

/* ---------- Bilah atas ---------- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  background:#050308cc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
#menuBtn{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--line);background:#ffffff0a;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;padding:0}
#menuBtn span{display:block;width:20px;height:2px;border-radius:2px;background:var(--ink)}
.brand{font-family:var(--font-d);font-weight:900;font-size:19px;letter-spacing:.14em;
  background:linear-gradient(90deg,var(--cy),var(--vi) 55%,var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:30px;background:#ffffff0a;border:1px solid var(--line);font-weight:700;font-size:13px;max-width:44vw}
.chip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ava{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:900;font-size:14px;color:#04101c;background:linear-gradient(135deg,var(--cy),var(--mg))}

/* ---------- Drawer ---------- */
#scrim{position:fixed;inset:0;z-index:30;background:#000b;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;z-index:31;width:min(80vw,290px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--cardhi),#08061a);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  padding:max(18px,env(safe-area-inset-top)) 14px 18px}
#drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:12px;padding:8px 6px 18px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.d-head .ava{width:44px;height:44px;font-size:20px}
.d-head b{display:block;font-size:16px}
.d-head small{color:var(--mute)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:15px;font-weight:600;text-align:left;cursor:pointer;transition:background .15s}
.nav button:hover,.nav button.on{background:#ffffff10}
.nav button.on{color:var(--cy)}
.nav .sp{flex:1}
.nav button.out{color:var(--bad);margin-top:auto}
.d-foot{margin-top:auto}
#drawer>.nav{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--cy) #ffffff14}
#drawer>.nav button{flex:none}
#drawer>.nav::-webkit-scrollbar{width:6px}
#drawer>.nav::-webkit-scrollbar-track{background:#ffffff14;border-radius:6px}
#drawer>.nav::-webkit-scrollbar-thumb{background:var(--cy);border-radius:6px}
.d-foot{flex:none}

/* ---------- Beranda ---------- */
main{max-width:1100px;margin:0 auto;padding:16px 14px 40px;position:relative}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 22px;background:linear-gradient(135deg,#150a30,#0a1a3a 55%,#071e28);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-height:180px}
.hero .bh{width:260px;height:260px;top:-90px;right:-90px}
.hero small{position:relative;z-index:1;color:var(--cy);font-weight:700;letter-spacing:.06em;font-size:12px}
.hero h1{position:relative;z-index:1;margin:0;font-family:var(--font-d);font-weight:800;font-size:clamp(20px,5vw,30px);line-height:1.2}
.hero p{position:relative;z-index:1;margin:0;color:#c7cdf5;max-width:42ch;font-size:14px;line-height:1.5}
.hero .btn{position:relative;z-index:1;width:auto;align-self:flex-start;padding:0 22px;margin-top:10px}
/* ---------- Teman (status online/offline) ---------- */
.fRow{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fRow::-webkit-scrollbar{display:none}
.fr{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:inherit;cursor:pointer;font:inherit}
.fc{position:relative;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:900;font-size:30px;color:#04101c;border:3px solid #3a3a48}
.fr:not(.on):not(.pl) .fc{filter:grayscale(.85) brightness(.65)}
.fr.on .fc{border-color:var(--ok)}.fr.pl .fc{border-color:var(--cy)}
.fc i{position:absolute;right:0;bottom:0;width:16px;height:16px;border-radius:50%;background:#666;border:3px solid var(--bg)}
.fr.on .fc i{background:var(--ok)}.fr.pl .fc i{background:var(--cy)}
.fn{max-width:84px;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs{max-width:84px;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr.on .fs{color:var(--ok)}.fr.pl .fs{color:var(--cy)}
.fc.add{background:#ffffff10;color:var(--ink);border:2px dashed var(--line);font-size:34px;font-weight:400;filter:none!important}
.fEmpty{flex:none;align-self:center;max-width:180px;color:var(--mute);font-size:12.5px;line-height:1.4}

.sec{display:flex;align-items:center;gap:10px;margin:28px 0 14px;flex-wrap:wrap}
.sec h2{margin:0;font-family:var(--font-d);font-weight:800;font-size:18px;letter-spacing:.02em}
.sec .sp{flex:1}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#ffffff08;border:1px solid var(--line2)}
.seg button{border:0;background:transparent;color:var(--mute);font-weight:700;font-size:13px;padding:7px 13px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:linear-gradient(90deg,var(--cy),var(--vi));color:#04101c}
.search{height:40px;width:min(48vw,240px);border-radius:12px;border:1px solid var(--line);background:#ffffff08;color:var(--ink);padding:0 14px;font:inherit;font-size:14px;outline:none;transition:border-color .15s}
.search:focus{border-color:var(--cy)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;border-radius:18px;background:var(--card);border:1px solid var(--line2);overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0;
  transition:transform .18s,border-color .18s,box-shadow .18s}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:#39f4ff66;box-shadow:0 14px 34px #00000066,0 0 0 1px #39f4ff22}
.card:active{transform:scale(.98)}
.thumb{position:relative;aspect-ratio:16/10;background:var(--void);overflow:hidden}
.thumb img,.thumb svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:10px;top:10px;z-index:1;padding:4px 10px;border-radius:20px;background:#000a;backdrop-filter:blur(4px);font-size:11px;font-weight:800;letter-spacing:.03em;border:1px solid #ffffff22}
.badge.recent{left:auto;right:44px;background:linear-gradient(90deg,var(--mg),var(--vi));border:0;color:#fff}
.fav{position:absolute;right:8px;top:8px;z-index:2;width:30px;height:30px;border-radius:50%;border:1px solid #ffffff22;background:#000a;backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mute);font-size:15px;line-height:1;transition:color .15s,transform .15s}
.fav:hover{transform:scale(1.08)}
.fav.on{color:var(--gold)}
.meta{padding:13px 14px 15px;display:flex;flex-direction:column;gap:4px}
.meta b{font-size:16px;font-weight:700}
.meta span{color:var(--mute);font-size:12.5px;line-height:1.4}
.meta .play{margin-top:9px;height:38px;border:0;border-radius:11px;background:linear-gradient(90deg,var(--ok),#1fd18a);color:#04140c;font-weight:800;font-size:14px;cursor:pointer}
.empty{color:var(--mute);padding:30px 4px;text-align:center;font-size:14px}
footer{color:var(--mute2);font-size:12px;text-align:center;padding:14px 0 30px}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;z-index:50;background:#000c;backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px}
.m-card{width:min(92vw,380px);border-radius:20px;background:linear-gradient(180deg,var(--cardhi),var(--card));border:1px solid var(--line);padding:24px 22px;text-align:center}
.m-card h3{margin:0 0 10px;font-family:var(--font-d);font-size:18px;font-weight:800}
.m-card p{margin:0 0 16px;color:var(--mute);font-size:14px;line-height:1.5}
.m-card .stats{display:flex;gap:8px;margin-bottom:16px}
.m-card .stat{flex:1;border-radius:12px;background:#ffffff08;border:1px solid var(--line2);padding:10px 6px}
.m-card .stat b{display:block;font-size:19px;color:var(--cy)}
.m-card .stat span{font-size:11px;color:var(--mute)}
.m-card .row{display:flex;gap:10px}
.m-card .btn{margin-top:0}
.status{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:14px;
  background:#0d0b1de6;border:1px solid var(--line);font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 10px 30px #0008}
.status.on{opacity:1;transform:translateX(-50%) translateY(-2px)}
.status.err{border-color:#ff4d6a55}
.status.ok{border-color:#33f2a055}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.hr{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.hr .chip{margin-left:0}
.coinchip{padding:5px 12px;color:var(--gold);border-color:#ffcf6b44}
#avM{position:fixed;inset:0;z-index:60;background:#000d;display:flex;align-items:center;justify-content:center;padding:12px}
#avM .av-card{width:min(96vw,560px);max-height:94vh;overflow:auto;border-radius:20px;background:linear-gradient(180deg,var(--cardhi),var(--card));border:1px solid var(--line);padding:16px}
#avM h3{margin:0 0 10px;font-family:var(--font-d);font-size:17px;font-weight:800}
.av-top{display:flex;gap:14px;align-items:flex-start}
.av-prev{flex:none;width:130px;border-radius:14px;background:#ffffff08;border:1px solid var(--line2);padding:6px}
.av-prev svg{width:100%;height:auto;display:block}
.av-side{flex:1;min-width:0}
.av-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.av-tabs button,.av-opts button,.av-sets button{font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:#ffffff0d;border:1px solid var(--line2);border-radius:10px;padding:7px 10px;cursor:pointer}
.av-tabs button.on,.av-opts button.on{border-color:var(--cy);background:#39f4ff1f}
.av-opts{display:flex;flex-direction:column;gap:6px}
.av-opts button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.av-opts button[disabled]{opacity:.45;cursor:not-allowed}
.av-opts i{font-style:normal;font-size:10px;color:var(--mute)}
.av-sw{display:flex;flex-wrap:wrap;gap:8px}
.av-sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line2);cursor:pointer;padding:0}
.av-sw button.on{border-color:var(--cy);box-shadow:0 0 0 2px #39f4ff55}
.av-prog{margin:12px 0 4px;font-size:12px;color:var(--mute);padding:8px 10px;border-radius:12px;background:#ffffff08;border:1px solid var(--line2)}
.av-prog b{color:var(--ink)}.dots{display:flex;gap:5px;margin-top:5px}.dots i{flex:1;height:7px;border-radius:4px;background:#ffffff1a}.dots i.on{background:var(--cy);box-shadow:0 0 6px var(--cy)}
.av-opts button.lk{opacity:.7}
.av-prev.pv-ninja svg{transform:rotate(13deg) translateX(4px);animation:pvn .5s ease-in-out infinite alternate}
.av-prev.pv-fly svg{transform:rotate(-72deg) scale(.82);animation:pvf 1.4s ease-in-out infinite alternate}
@keyframes pvn{to{transform:rotate(16deg) translate(7px,-3px)}}@keyframes pvf{to{transform:rotate(-72deg) scale(.82) translateX(10px)}}
.mdl{position:fixed;inset:0;z-index:60;background:#000d;display:flex;align-items:center;justify-content:center;padding:12px}
.mdl-card{width:min(94vw,440px);max-height:92vh;overflow:auto;border-radius:20px;background:linear-gradient(180deg,var(--cardhi),var(--card));border:1px solid var(--line);padding:16px}
.mdl h3{margin:0 0 12px;font-family:var(--font-d);font-size:17px;font-weight:800}
.up-cur{text-align:center;padding:12px;border-radius:14px;background:#ffffff08;border:1px solid var(--line2);margin-bottom:10px;font-size:13px;color:var(--mute)}.up-cur b{font-size:28px;color:var(--gold)}
.up-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.up-row{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;background:#ffffff0a;border:1px solid var(--line2);font-weight:700}.up-row.nx{border-color:var(--cy);background:#39f4ff14}
.gf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.gf{position:relative;text-align:center;padding:8px 2px;border-radius:12px;background:#ffffff0a;border:1px solid var(--line2);font-size:12px}.gf small{display:block;color:var(--mute);font-size:10px}.gf div{font-size:20px;margin:2px 0}.gf b{font-size:11px;color:var(--gold)}
.gf.big{grid-column:span 2}.gf.cur{border-color:var(--cy);box-shadow:0 0 8px #39f4ff66}.gf.done{opacity:.55}.gf em{position:absolute;top:3px;right:6px;font-style:normal;color:#5be38f}
.av-sets{display:flex;gap:6px;margin:12px 0 8px}
.av-sets{flex-wrap:wrap}
.av-foot{display:flex;gap:8px;margin-top:10px;position:sticky;bottom:-16px;padding:10px 0 4px;background:linear-gradient(180deg,#0000,var(--card) 30%)}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>
<button id="sndBtn" type="button" aria-label="Suara musik" title="Musik" style="position:fixed;right:12px;bottom:12px;z-index:90;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#0f0c1ecc;color:var(--ink);font-size:20px;cursor:pointer;backdrop-filter:blur(6px)">🔊</button>

<!-- LAYAR AWAL: MASUKKAN USERNAME -->
<section id="splash" hidden>
  <div class="bh" aria-hidden="true"></div>
  <div class="sp-card">
    <h1 class="logo">NEXORIA</h1>
    <p class="logo-sub">Platform game mabar. Buat username dan langsung main.</p>
    <div class="field">
      <label for="uname">Username</label>
      <input id="uname" type="text" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="contoh: Budi_123">
      <p class="hint">3–16 karakter: huruf, angka, atau garis bawah (_).</p>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="goBtn">MASUK</button>
  </div>
</section>

<!-- APLIKASI (BERANDA) -->
<div id="app" hidden>
  <header>
    <button id="menuBtn" aria-label="Buka menu navigasi"><span></span><span></span><span></span></button>
    <div class="brand">NEXORIA</div>
    <div class="hr"><div class="chip coinchip" title="Koin: +0,5/d saat bermain"><span>💵</span><b id="coinV">0</b></div><div class="chip"><div class="ava" id="avaTop">N</div><b id="nameTop"></b></div></div>
  </header>

  <div id="scrim"></div>
  <aside id="drawer" aria-label="Navigasi">
    <div class="d-head"><div class="ava" id="avaSide">N</div><div><b id="nameSide"></b><small>Akun terdaftar</small></div></div>
    <div class="nav">
      <button id="navHome" class="on">🏠 Beranda</button>
      <button id="navGames">🎮Semua Game</button>
      <button id="navAvatar">🎨 Avatar</button>
      <button id="navShop">🛒 Shop</button>
      <button id="navGift">🎁 Hadiah Harian</button>
      <button id="navRedeem">🎟️ Redeem Code</button>
      <button id="navProfile">👤 Profil</button>
    </div>
    <div class="d-foot"><div class="nav"><button class="out" id="navLogout">⛔ Logout</button></div></div>
  </aside>

  <main id="home">
    <section class="friends">
      <div class="sec" style="margin-top:6px"><h2>👥 Teman</h2></div>
      <div class="fRow" id="fRow"></div>
    </section>

    <div class="sec" id="gamesTop">
      <h2>Game</h2>
      <div class="sp"></div>
      <div class="seg" role="group" aria-label="Filter game">
        <button class="on" id="filAll">Semua</button>
        <button id="filFav">⭐ Favorit</button>
      </div>

let galaxyRAF=0;
function drawStars(){
  const c=$('stars'),ctx=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight,M=Math.min(W,H);
  c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';
  cancelAnimationFrame(galaxyRAF);
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* nebula + galaksi spiral digambar sekali ke kanvas tersembunyi */
  const nb=document.createElement('canvas');nb.width=W;nb.height=H;const nx=nb.getContext('2d');
  nx.fillStyle='#050308';nx.fillRect(0,0,W,H);
  [[.18,.22,.62,'139,92,246',.34],[.85,.18,.5,'57,244,255',.17],[.75,.8,.66,'255,47,166',.22],[.1,.88,.55,'70,50,220',.26],[.5,.5,.8,'30,14,96',.38]].forEach(q=>{
    const x=q[0]*W,y=q[1]*H,r=q[2]*M*1.25,g=nx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba('+q[3]+','+q[4]+')');g.addColorStop(.55,'rgba('+q[3]+','+(q[4]*.35).toFixed(3)+')');g.addColorStop(1,'rgba('+q[3]+',0)');
    nx.fillStyle=g;nx.fillRect(0,0,W,H);
  });
  {const gx=W*.72,gy=H*.3,R=M*.42,cg=nx.createRadialGradient(gx,gy,0,gx,gy,R*.35);
   cg.addColorStop(0,'rgba(255,236,200,.55)');cg.addColorStop(.35,'rgba(190,150,255,.28)');cg.addColorStop(1,'rgba(139,92,246,0)');nx.fillStyle=cg;nx.fillRect(gx-R,gy-R,R*2,R*2);
   for(let arm=0;arm<2;arm++)for(let i=0;i<900;i++){
     const t=Math.random()*3.4,rr=R*.06*Math.exp(t*.62),an=t*2.1+arm*Math.PI+(Math.random()-.5)*.55,sc=(Math.random()-.5)*rr*.22;
     const px=gx+Math.cos(an)*rr+sc,py=gy+Math.sin(an)*rr*.46+sc*.5,al=(Math.random()*.5+.15)*(1-t/3.8);
     nx.fillStyle=(i%5===0?'rgba(255,170,230,':i%3===0?'rgba(150,235,255,':'rgba(215,200,255,')+al.toFixed(2)+')';
     nx.beginPath();nx.arc(px,py,Math.random()*1.1+.2,0,7);nx.fill();
   }}
  const lay=[{n:Math.round(W*H/7500),s:.012,r:[.2,.9],a:[.15,.55]},{n:Math.round(W*H/14000),s:.03,r:[.5,1.4],a:[.3,.8]},{n:Math.round(W*H/40000),s:.07,r:[1,2.1],a:[.55,1]}]
   .map(L=>({s:L.s,st:Array.from({length:L.n},()=>({x:Math.random()*W,y:Math.random()*H,r:L.r[0]+Math.random()*(L.r[1]-L.r[0]),a:L.a[0]+Math.random()*(L.a[1]-L.a[0]),ph:Math.random()*6.28,sp:.6+Math.random()*2.2,col:Math.random()<.18?'255,190,235':Math.random()<.3?'170,235,255':'232,234,255'}))}));
  let shoot=null,nextShoot=performance.now()+3000;
  function frame(now){
    const t=now/1000;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.drawImage(nb,Math.sin(t*.05)*14-14,Math.cos(t*.04)*10-10,W+28,H+20);
    lay.forEach(L=>{
      const dx=((t*L.s*60)%W);
      L.st.forEach(s=>{
        const x=((s.x-dx)%W+W)%W,tw=still?1:.55+.45*Math.sin(t*s.sp+s.ph);
        ctx.fillStyle='rgba('+s.col+','+(s.a*tw).toFixed(2)+')';
        ctx.beginPath();ctx.arc(x,s.y,s.r,0,7);ctx.fill();
        if(s.r>1.6){ctx.fillStyle='rgba('+s.col+','+(s.a*tw*.25).toFixed(2)+')';ctx.fillRect(x-s.r*3,s.y-.4,s.r*6,.8);ctx.fillRect(x-.4,s.y-s.r*3,.8,s.r*6);}
      });
    });
    if(!still){
      if(!shoot&&now>nextShoot){const an=.5+Math.random()*.4;shoot={x:Math.random()*W*.8+W*.2,y:Math.random()*H*.4,vx:-Math.cos(an)*9,vy:Math.sin(an)*9,l:0};}
      if(shoot){
        shoot.x+=shoot.vx;shoot.y+=shoot.vy;shoot.l++;
        const g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*9,shoot.y-shoot.vy*9);
        g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(139,92,246,0)');
        ctx.strokeStyle=g;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(shoot.x,shoot.y);ctx.lineTo(shoot.x-shoot.vx*9,shoot.y-shoot.vy*9);ctx.stroke();
        if(shoot.l>60||shoot.x<-60||shoot.y>H+60){shoot=null;nextShoot=now+4000+Math.random()*6000;}
      }
      if(!document.hidden)galaxyRAF=requestAnimationFrame(frame);
    }
  }
  frame(performance.now());
  if(!still)document.addEventListener('visibilitychange',()=>{if(!document.hidden){cancelAnimationFrame(galaxyRAF);galaxyRAF=requestAnimationFrame(frame);}});
}

async function submitName(){

  if(!d){err.textContent='Tidak bisa terhubung ke server. Periksa internet lalu coba lagi.';return;}
  btn.disabled=true;btn.textContent='MEMERIKSA…';
  try{
    const key=name.toLowerCase(),ref=d.ref('nexoria/users/'+key);
    const snap=await withTimeout(ref.once('value'),10000);
    let finalName=name;
    if(snap.exists()){
      const v=snap.val()||{};finalName=v.name||name;
      const ok=await askConfirm('Username sudah terdaftar','"'+finalName+'" sudah ada di NEXORIA. Masuk ke akun ini?','Masuk','Batal');
      if(!ok){btn.disabled=false;btn.textContent='MASUK';return;}
      await withTimeout(ref.update({lastLogin:Date.now()}),10000);
    }else{
      await withTimeout(ref.set({name:name,createdAt:Date.now(),lastLogin:Date.now()}),10000);
    }
    USER=finalName;
    try{localStorage.setItem(LS_USER,USER);}catch(e){}
    status('Selamat datang, '+USER+'!','ok');
    showApp();tickLoginStreak();
  }catch(e){
    err.textContent=(e&&e.message==='timeout')?'Server tidak merespons. Coba lagi.':'Gagal terhubung ke server (cek koneksi atau aturan database).';
    btn.disabled=false;btn.textContent='MASUK';

}

const NSE_PATH='nexoria/curitelur/narutoSkinEvent';
let skinEv=null,heroOn=false,streakInfo={n:0,last:''},heroWatch=false;
function todayUTC(off){const d=new Date(Date.now()-(off||0)*86400000);return d.toISOString().slice(0,10);}
function watchHero(){
  const d=getDB();if(!d||!USER||heroWatch)return;heroWatch=true;
  const key=USER.toLowerCase();
  d.ref(NSE_PATH).on('value',sn=>{skinEv=sn.val()||null;if($('avM'))renderAv();});
  d.ref('nexoria/users/'+key+'/heroUnlocked').on('value',sn=>{heroOn=!!sn.val();if($('avM'))renderAv();});
  d.ref('nexoria/users/'+key+'/streak').on('value',sn=>{streakInfo=sn.val()||{n:0,last:''};if($('avM'))renderAv();});
}
function skinEventActive(){return !!(skinEv&&skinEv.start&&Date.now()<+skinEv.start+30*86400000);}
function tickLoginStreak(){
  const d=getDB();if(!d||!USER)return;
  watchHero();
  const ref=d.ref('nexoria/users/'+USER.toLowerCase()+'/streak'),today=todayUTC(0),yst=todayUTC(1);
  ref.transaction(cur=>{
    if(!skinEventActive())return cur;   /* misi hanya berjalan selama event Naruto aktif */
    cur=cur||{n:0,last:'',got:0};
    if(cur.last===today)return cur;
    const n=cur.last===yst?(cur.n||0)+1:1;
    return {n,last:today,got:cur.got||0};
  }).then(r=>{
    if(!r.committed)return;
    const v=r.snapshot.val();
    if(v&&v.n>=7&&!v.got){
      d.ref('nexoria/users/'+USER.toLowerCase()+'/streak/got').set(1).catch(()=>{});
      d.ref('nexoria/users/'+USER.toLowerCase()+'/heroUnlocked').set(1).catch(()=>{});
      status('🎉 Misi 7 hari selesai! Kostum Naruto & Sasuke terbuka untuk selamanya!','ok');
    }
  }).catch(()=>{});
}

let buying=false;
function buyOwned(key,price,label){
  const d=getDB();if(!d||!USER){status('Belum terhubung ke server','err');return;}
  if(OWN[key]||buying)return;
  const nf=n=>Math.floor(n).toLocaleString('id-ID');
  if(COINS<price){status('Koin kurang: kamu punya 💵 '+nf(COINS)+', butuh 💵 '+nf(price),'err');return;}
  const K='nexoria/users/'+USER.toLowerCase(),cref=d.ref(K+'/coins');buying=true;
  cref.transaction(cur=>{if(cur===null)return 0;cur=Math.floor(+cur||0);return cur>=price?cur-price:undefined;}).then(r=>{
    if(!r.committed){status('Koin kurang: kamu punya 💵 '+nf(COINS)+', butuh 💵 '+nf(price),'err');return;}
    return d.ref(K+'/owned/'+key).set(1).then(()=>{OWN[key]=1;if(key==='shadowpurple')SPON=true;status('✅ '+label+' terbeli!','ok');refreshUI();})
      .catch(e=>{cref.set(firebase.database.ServerValue.increment(price)).catch(()=>{});status('Gagal menyimpan pembelian, koin dikembalikan'+(e&&e.code?' ('+e.code+')':''),'err');});
  }).catch(e=>status('Pembelian gagal'+(e&&e.code?' ('+e.code+')':'')+', coba lagi','err')).then(()=>{buying=false;});
}

function buyIncome(){
  const d=getDB();if(!d||!USER){status('Belum terhubung ke server','err');return;}
  if(buying||INC>=INC_MAX)return;
  const lv=INC,cost=incCost(lv),nf=n=>Math.floor(n).toLocaleString('id-ID');
  if(COINS<cost){status('Koin kurang: kamu punya 💵 '+nf(COINS)+', butuh 💵 '+nf(cost),'err');return;}
  const K='nexoria/users/'+USER.toLowerCase(),cref=d.ref(K+'/coins');buying=true;
  cref.transaction(cur=>{if(cur===null)return 0;cur=Math.floor(+cur||0);return cur>=cost?cur-cost:undefined;}).then(r=>{
    if(!r.committed){status('Koin kurang: kamu punya 💵 '+nf(COINS)+', butuh 💵 '+nf(cost),'err');return;}
    return d.ref(K+'/incomeLv').set(lv+1).then(()=>{INC=lv+1;status('⬆ Penghasilan naik jadi '+fmtR(incRate(INC))+'/d!','ok');refreshUI();})
      .catch(e=>{cref.set(firebase.database.ServerValue.increment(cost)).catch(()=>{});status('Gagal menyimpan upgrade, koin dikembalikan'+(e&&e.code?' ('+e.code+')':''),'err');});
  }).catch(e=>status('Upgrade gagal'+(e&&e.code?' ('+e.code+')':''),'err')).then(()=>{buying=false;});
}
/* ---------- HADIAH HARIAN: hari 1-7, hadiah uang acak ---------- */
function openGift(){
  openMdl('🎁 Hadiah Harian',body=>{
    const ds=dailyShown(),next=ds.today?(ds.n%7)+1:(ds.n%7)+1;
    let cells='';
    for(let i=1;i<=7;i++){
      const done=i<=ds.n,cur=!ds.today&&i===next;
      cells+='<div class="gf'+(done?' done':'')+(cur?' cur':'')+(i===7?' big':'')+'"><small>Hari '+i+'</small><div>'+(i===7?'🎁':'💵')+'</div><b>'+fmtC(GIFT[i-1][0])+'–'+fmtC(GIFT[i-1][1])+'</b>'+(done?'<em>✔</em>':'')+'</div>';
    }
    body.innerHTML='<div class="gf-grid">'+cells+'</div>'
      +(ds.today?'<button class="btn" disabled>Sudah diambil hari ini · kembali besok</button>':'<button class="btn" id="gfBtn">🎁 Ambil Hadiah Hari '+next+'</button>')
      +'<p class="hint" style="text-align:center">Login tiap hari tanpa putus. Kalau terlewat sehari, hitungan kembali ke Hari 1.</p>';
    const bt=$('gfBtn');if(bt)bt.onclick=claimGift;
  });
}
function claimGift(){
  const d=getDB();if(!d||!USER){status('Belum terhubung ke server','err');return;}
  if(buying)return;buying=true;
  const K='nexoria/users/'+USER.toLowerCase(),t=todayUTC(0),y=todayUTC(1);let prev=null,amt=0,day=0;
  d.ref(K+'/daily').transaction(cur=>{
    prev=cur;cur=cur||{n:0,last:''};
    if(cur.last===t)return;
    const base=cur.last===y?(cur.n||0):0;day=(base%7)+1;
    const r=GIFT[day-1];amt=r[0]+Math.floor(Math.random()*(r[1]-r[0]+1));
    return{n:day,last:t,amt};
  }).then(r=>{
    if(!r.committed){status('Hadiah hari ini sudah diambil','err');return;}
    return d.ref(K+'/coins').set(firebase.database.ServerValue.increment(amt)).then(()=>{status('🎁 Hari '+day+': kamu dapat 💵 '+Math.floor(amt).toLocaleString('id-ID')+'!','ok');})
      .catch(e=>{d.ref(K+'/daily').set(prev).catch(()=>{});status('Gagal memberi hadiah, coba lagi'+(e&&e.code?' ('+e.code+')':''),'err');});
  }).catch(()=>status('Gagal mengambil hadiah','err')).then(()=>{buying=false;});
}
$('navShop').addEventListener('click',()=>{closeDrawer();openShop();});
$('navGift').addEventListener('click',()=>{closeDrawer();openGift();});
/* ---------- REDEEM CODE: tiap kode hanya 1× per akun ---------- */
const CODES={'NEXO2026':5000,'TAHERSAE':5000,'NEXTUPTD':5000};
function openRedeem(){
  openMdl('🎟️ Redeem Code',body=>{
    body.innerHTML='<input id="rdIn" class="field-in" maxlength="24" placeholder="Masukkan kode" autocomplete="off" autocapitalize="characters" spellcheck="false" style="width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:#ffffff0a;color:var(--ink);padding:0 14px;font:700 16px var(--font-b);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px">'
      +'<button class="btn" id="rdGo">Klaim</button><p class="hint" style="text-align:center">Setiap kode hanya bisa dipakai 1× per akun.</p>';
    $('rdGo').onclick=redeemCode;$('rdIn').addEventListener('keydown',e=>{if(e.key==='Enter')redeemCode();});
  });
}
function redeemCode(){
  const d=getDB();if(!d||!USER){status('Belum terhubung ke server','err');return;}
  const code=($('rdIn').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!code){status('Masukkan kode dulu','err');return;}
  const amt=CODES[code];if(!amt){status('Kode tidak valid','err');return;}
  if(buying)return;buying=true;
  const K='nexoria/users/'+USER.toLowerCase();
  d.ref(K+'/redeemed/'+code).transaction(cur=>cur===null?1:undefined).then(r=>{
    if(!r.committed){status('Kode ini sudah kamu pakai','err');return;}
    return d.ref(K+'/coins').set(firebase.database.ServerValue.increment(amt)).then(()=>{status('🎟️ Kode berhasil! +💵 '+Math.floor(amt).toLocaleString('id-ID'),'ok');$('rdIn').value='';})
      .catch(e=>{d.ref(K+'/redeemed/'+code).remove().catch(()=>{});status('Gagal menambah koin, coba lagi'+(e&&e.code?' ('+e.code+')':''),'err');});
  }).catch(e=>status('Gagal memproses kode'+(e&&e.code?' ('+e.code+')':''),'err')).then(()=>{buying=false;});
}
$('navRedeem').addEventListener('click',()=>{closeDrawer();openRedeem();});
$('navAvatar').addEventListener('click',()=>{closeDrawer();openAvatar();});

/* ---------- TEMAN: online/offline + sedang main apa ---------- */
const FR={},FP={},FRW={};let srvOff=0,fReady=false,launching=false;
const PRES_TTL=75000,PRES_TTL_NOHB=600000;   /* game dengan heartbeat: 75 dtk; game tanpa heartbeat: 10 menit sejak diluncurkan */
const gName=id=>{const g=GAMES.find(x=>x.id===id);return id==='curitelur'?'Mencuri telur':g?'Bermain '+g.name:'Online';};
const fHue=n=>{let x=0;for(const c of String(n))x=(x*31+c.charCodeAt(0))%360;return x;};
function fStat(k){
  const p=FP[k];if(!p||!p.ts)return{s:0,t:'Offline'};
  const age=Date.now()+srvOff-p.ts;
  if(age>(p.hb?PRES_TTL:PRES_TTL_NOHB))return{s:0,t:'Offline'};
  return p.g?{s:2,t:gName(p.g)}:{s:1,t:'Online'};
}
function renderFriends(){
  const box=$('fRow');if(!box)return;
  const arr=Object.keys(FR).map(k=>({k,n:FR[k],st:fStat(k)})).sort((a,b)=>b.st.s-a.st.s||a.n.localeCompare(b.n));
  box.innerHTML=arr.map(f=>{const x=fHue(f.n),cl=f.st.s===2?'pl':f.st.s===1?'on':'';
    return '<button class="fr '+cl+'" data-k="'+esc(f.k)+'"><div class="fc" style="background:linear-gradient(135deg,hsl('+x+' 80% 62%),hsl('+((x+60)%360)+' 80% 52%))">'+esc((f.n[0]||'?').toUpperCase())+'<i></i></div><div class="fn">'+esc(f.n)+'</div><div class="fs">'+esc(f.st.t)+'</div></button>';}).join('')
    +'<button class="fr" id="fAdd" aria-label="Tambah teman"><div class="fc add">+</div><div class="fn">Tambah</div><div class="fs">teman</div></button>'
    +(arr.length?'':'<div class="fEmpty">Belum ada teman. Ketuk + lalu masukkan username.</div>');
  box.querySelectorAll('.fr[data-k]').forEach(b=>b.onclick=()=>friendInfo(b.dataset.k));
  $('fAdd').onclick=addFriendUI;
}
function setPres(g,hb){
  const d=getDB();if(!d||!USER)return Promise.resolve();
  return d.ref('nexoria/presence/'+USER.toLowerCase()).set({n:USER,g:g||'',hb:hb?1:0,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});
}
function startPresence(){
  const d=getDB();if(!d||!USER)return;
  const r=d.ref('nexoria/presence/'+USER.toLowerCase());
  const beat=()=>{if(document.hidden||launching)return;try{r.onDisconnect().remove();}catch(e){}setPres('',1);};
  beat();setInterval(beat,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)beat();});
}
function watchFriends(){
  const d=getDB();if(!d||!USER||fReady)return;fReady=true;
  renderFriends();
  d.ref('.info/serverTimeOffset').on('value',s=>{srvOff=+s.val()||0;});
  const fref=d.ref('nexoria/users/'+USER.toLowerCase()+'/friends');
  fref.on('child_added',sn=>{const k=sn.key;FR[k]=String(sn.val()||k);const r=d.ref('nexoria/presence/'+k);FRW[k]=r;r.on('value',s=>{FP[k]=s.val();renderFriends();});renderFriends();});
  fref.on('child_removed',sn=>{const k=sn.key;if(FRW[k]){FRW[k].off();delete FRW[k];}delete FR[k];delete FP[k];renderFriends();});
  setInterval(renderFriends,20000);
  startPresence();
}
function addFriendUI(){
  modal('<h3>👥 Tambah Teman</h3><p>Masukkan username temanmu.</p><input id="fIn" class="search" style="width:100%;margin-bottom:12px" placeholder="Username" maxlength="16" autocomplete="off" autocapitalize="off"><div class="row"><button class="btn ghost" id="fNo">Batal</button><button class="btn" id="fOk">Tambah</button></div>',c=>{
    c.querySelector('#fNo').onclick=closeModal;
    const ok=c.querySelector('#fOk');
    ok.onclick=()=>{
      const v=c.querySelector('#fIn').value.trim(),k=v.toLowerCase(),d=getDB();
      if(!valid(v)){status('Username tidak valid','err');return;}
      if(k===USER.toLowerCase()){status('Itu akunmu sendiri','err');return;}
      if(FR[k]){status('Sudah jadi temanmu','err');return;}
      if(!d){status('Belum terhubung ke server','err');return;}
      ok.disabled=true;
      withTimeout(d.ref('nexoria/users/'+k+'/name').once('value'),8000).then(s=>{
        if(!s.exists()){status('Username tidak ditemukan','err');ok.disabled=false;return;}
        const nm=String(s.val()||v);
        return d.ref('nexoria/users/'+USER.toLowerCase()+'/friends/'+k).set(nm).then(()=>{status('✅ '+nm+' ditambahkan','ok');closeModal();});
      }).catch(()=>{status('Gagal menambah teman','err');ok.disabled=false;});
    };
    setTimeout(()=>{try{c.querySelector('#fIn').focus();}catch(e){}},60);
  });
}
function friendInfo(k){
  const n=FR[k];if(!n)return;const st=fStat(k);
  modal('<h3>'+esc(n)+'</h3><p>'+(st.s?'🟢 ':'⚫ ')+esc(st.t)+'</p><div class="row"><button class="btn ghost" id="fDel">Hapus teman</button><button class="btn" id="fOk2">Tutup</button></div>',c=>{
    c.querySelector('#fOk2').onclick=closeModal;
    c.querySelector('#fDel').onclick=()=>{const d=getDB();if(d)d.ref('nexoria/users/'+USER.toLowerCase()+'/friends/'+k).remove().catch(()=>{});closeModal();};
  });
}

/* ---------- mulai: akun terdaftar langsung ke beranda ---------- */
(function init(){
  let saved='';
  try{saved=(localStorage.getItem(LS_USER)||'').trim();}catch(e){}
  if(valid(saved)){
    USER=saved;showApp();
    const d=getDB();
    if(d){
      withTimeout(d.ref('nexoria/users/'+USER.toLowerCase()).once('value'),10000).then(s=>{
        if(!s.exists()){
          try{localStorage.removeItem(LS_USER);}catch(e){}
          USER='';showSplash();status('Akun tidak ditemukan, silakan daftar ulang','err');
        }else{
          const v=s.val()||{};
          if(v.name&&v.name!==USER){USER=v.name;try{localStorage.setItem(LS_USER,USER);}catch(e){}setUserUI();}
          d.ref('nexoria/users/'+USER.toLowerCase()+'/lastLogin').set(Date.now());tickLoginStreak();
        }
      }).catch(()=>{});
    }
  }else showSplash();
})();
})();
</script>
